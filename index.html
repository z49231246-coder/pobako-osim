        body {

        }
        .card-custom {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
        }
        .form-control, .form-select {
            background-color: #0f172a;
            border-color: #334155;
            color: #f8fafc;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            color: #f8fafc;
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }
        .table-custom {
            color: #f8fafc;
            vertical-align: middle;
        }
        .table-custom th {
            background-color: #334155 !important;
            color: #cbd5e1;
            border-color: #475569;
        }
        .table-custom td {
            border-color: #334155;

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <!-- 1. BAGIAN HALAMAN LOGIN -->
                <div id="loginCard" class="card card-custom shadow-lg p-4 mx-auto" style="max-width: 500px;">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary"><i class="bi bi-shield-lock-fill me-2"></i>LOGIN PETUGAS OSIM</h3>
                        <p class="text-muted small">Masukkan Username dan Password sesuai SK Kepengurusan</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-light">Username</label>
                            <input type="text" class="form-control" id="usernameInput" placeholder="Contoh: ketua, sekbid1.1" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-light">Password</label>
                            <input type="password" class="form-control" id="passwordInput" placeholder="Masukkan password..." required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> MASUK SISTEM
                        </button>
                    </form>
                    <div id="loginError" class="text-danger text-center mt-3 small"></div>
                </div>

                <!-- 2. BAGIAN UTAMA SETELAH LOGIN (Form Input & Tabel Rekap) -->
                <div id="mainAppCard" class="d-none">
                    
                    <!-- Header Info Petugas -->
                    <div class="card card-custom shadow p-4 mb-4 d-flex flex-row justify-content-between align-items-center">
                        <div>
                            <h4 class="fw-bold text-primary m-0"><i class="bi bi-journal-text me-2"></i>Dashboard Pelaporan POBAKO</h4>
                            <p class="text-muted m-0 small">Petugas Bertugas: <span id="namaPetugasLogin" class="text-warning fw-bold"></span></p>
                        </div>
                        <button class="btn btn-outline-danger btn-sm px-3" onclick="logout()">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </button>
                    </div>

                    <!-- Form Input -->
                    <div class="card card-custom shadow-lg p-4 mb-4">
                        <h5 class="fw-bold text-success mb-3"><i class="bi bi-plus-circle-fill me-2"></i>Input Pelanggaran Baru</h5>
                        <form id="inputForm">
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold text-light">Tanggal Kejadian</label>
                                    <input type="date" class="form-control" id="tanggal" required>
                                </div>
                                <div class="col-md-8 mb-3">
                                    <label class="form-label fw-semibold text-light">Nama Santri yang Melanggar & Kelas</label>
                                    <input class="form-control" list="listSantri" id="namaSantri" placeholder="Ketik atau pilih nama santri..." required>
                                    <datalist id="listSantri"></datalist>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold text-light">Kata yang Diucapkan</label>
                                <input type="text" class="form-control" id="kataUcap" placeholder="Contoh: Kata-kata kotor / tidak sopan..." required>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow">
                                <i class="bi bi-send-fill me-1"></i> KIRIM LAPORAN
                            </button>
                        </form>
                    </div>

                    <!-- Tabel Rekapitulasi Riwayat Input -->
                    <div class="card card-custom shadow-lg p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold text-info m-0"><i class="bi bi-table me-2"></i>Rekapitulasi Riwayat Pelanggaran</h5>
                            <span class="badge bg-secondary px-3 py-2" id="badgeTotalRekap">Total: 0 Laporan</span>
                        </div>
                        
                        <div class="table-responsive">
                            <table class="table table-custom table-hover align-middle">
                                <thead>
                                    <tr>

                                        <th width="30%">Nama Santri</th>
                                        <th width="25%">Kata yang Diucapkan</th>
                                        <th width="25%">Petugas Penginput</th>

                                    </tr>
                                </thead>
                                <tbody id="tabelRekapBody">
                                    <tr><td colspan="5" class="text-center text-muted py-4">Belum ada riwayat pelanggaran.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

            </div>

            const datalist = document.getElementById('listSantri');
            dataSiswaPDF.forEach(nama => {
                const opt = document.createElement('option');
                opt.value = nama;
                datalist.appendChild(opt);
            });
            document.getElementById('tanggal').valueAsDate = new Date();
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const userIn = document.getElementById('usernameInput').value.trim().toLowerCase();
            const passIn = document.getElementById('passwordInput').value.trim();

            const found = databaseAkun.find(acc => acc.user === userIn && acc.pass === passIn);

            if (found) {
                sessionStorage.setItem('pobako_petugas', found.nama);
                aktifkanApp(found.nama);
            } else {
                document.getElementById('loginError').innerText = "Username atau Password salah!";
            }
        });

        function aktifkanApp(nama) {
            document.getElementById('loginCard').classList.add('d-none');
            document.getElementById('mainAppCard').classList.remove('d-none');
            document.getElementById('namaPetugasLogin').innerText = nama;
            renderRekapTabel();
        }

        function logout() {
            sessionStorage.removeItem('pobako_petugas');
            document.getElementById('mainAppCard').classList.add('d-none');
            document.getElementById('loginCard').classList.remove('d-none');
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginError').innerText = '';
        }

        document.getElementById('inputForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newData = {
                id: Date.now(),
                tanggal: document.getElementById('tanggal').value,
                nama: document.getElementById('namaSantri').value,
                kata: document.getElementById('kataUcap').value,
                petugas: sessionStorage.getItem('pobako_petugas') || "Petugas OSIM"
            };

            let dataList = JSON.parse(localStorage.getItem('pobako_data')) || [];
            dataList.push(newData);
            localStorage.setItem('pobako_data', JSON.stringify(dataList));

            document.getElementById('namaSantri').value = '';
            document.getElementById('kataUcap').value = '';
            document.getElementById('tanggal').valueAsDate = new Date();

            renderRekapTabel();
            alert('Laporan berhasil disimpan dan dikirim ke Monitor TV!');
        });

        function renderRekapTabel() {
            let dataList = JSON.parse(localStorage.getItem('pobako_data')) || [];
            const tbody = document.getElementById('tabelRekapBody');
            document.getElementById('badgeTotalRekap').innerText = `Total: ${dataList.length} Laporan`;
            
            tbody.innerHTML = '';

            if (dataList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Belum ada riwayat pelanggaran.</td></tr>`;
                return;
            }

            dataList.slice().reverse().forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.tanggal}</td>
                        <td class="fw-semibold">${item.nama}</td>
                        <td><span class="badge bg-dark text-warning border border-secondary px-2 py-1">"${item.kata}"</span></td>
                        <td><small class="text-info"><i class="bi bi-person-badge me-1"></i>${item.petugas}</small></td>
                        <td class="text-center">
                            <button class="btn btn-outline-danger btn-sm" onclick="hapusLaporan(${item.id})" title="Hapus">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        function hapusLaporan(id) {
            if (confirm("Yakin ingin menghapus riwayat laporan ini?")) {
                let dataList = JSON.parse(localStorage.getItem('pobako_data')) || [];
                dataList = dataList.filter(item => item.id !== id);
                localStorage.setItem('pobako_data', JSON.stringify(dataList));
                renderRekapTabel();
            }
        }
    </script>
</body>
</html>
