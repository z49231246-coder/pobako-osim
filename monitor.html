<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Monitor Kedisiplinan - Pondok Pesantren Terpadu Al Fauzan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-title {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 2px solid #334155;
        }
        .card-monitor {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
        }
        .table-custom {
            color: #f8fafc;
            vertical-align: middle;
        }
        .table-custom th {
            background-color: #334155 !important;
            color: #cbd5e1;
            border-color: #475569;
            padding: 15px;
        }
        .table-custom td {
            border-color: #334155;
            padding: 12px 15px;
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <!-- Header Utama -->
        <div class="row mb-4 align-items-center header-title py-3 px-4 rounded-4 shadow">
            <div class="col">
                <h5 class="text-uppercase text-light m-0 opacity-75 small">Live Monitoring Kedisiplinan Santri</h5>
                <h2 class="fw-bold text-white m-0">PONDOK PESANTREN TERPADU AL FAUZAN</h2>
            </div>
            <div class="col-auto">
                <span class="badge bg-danger fs-6 px-3 py-2 shadow-sm">
                    <i class="bi bi-circle-fill text-white me-1"></i> LIVE TV MONITOR
                </span>
            </div>
        </div>

        <!-- Tabel Tunggal Global (Top Peringkat Pelanggaran) -->
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card card-monitor p-4 shadow-lg">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h4 class="fw-bold text-warning m-0"><i class="bi bi-trophy-fill me-2"></i>TOP RANKING PELANGGARAN KESELURUHAN</h4>
                            <p class="text-muted small m-0">Akumulasi seluruh data pelanggaran santri (Kelas 7, 8, dan 9)</p>
                        </div>
                        <span class="badge bg-primary px-3 py-2 fs-6" id="totalKasusBadge">Total Kasus: 0</span>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-custom table-hover">
                            <thead>
                                <tr>
                                    <th width="10%" class="text-center">RANK</th>
                                    <th>NAMA & KELAS SANTRI</th>
                                    <th width="20%" class="text-center">TOTAL POIN MINUS</th>
                                </tr>
                            </thead>
                            <tbody id="globalRankingBody">
                                <tr><td colspan="3" class="text-center text-muted py-4">Belum ada data pelanggaran tercatat.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function renderMonitor() {
            let dataList = JSON.parse(localStorage.getItem('pobako_data')) || [];

            // Update badge total kasus
            document.getElementById('totalKasusBadge').innerText = `Total Kasus: ${dataList.length}`;

            // Hitung frekuensi pelanggaran per nama santri
            let hitungPoin = {};
            dataList.forEach(item => {
                hitungPoin[item.nama] = (hitungPoin[item.nama] || 0) + 1;
            });

            // Ubah objek ke array dan urutkan dari poin terbanyak ke paling sedikit
            let sortedRanking = Object.keys(hitungPoin).map(nama => {
                return { nama: nama, total: hitungPoin[nama] };
            }).sort((a, b) => b.total - a.total);

            const tbody = document.getElementById('globalRankingBody');
            tbody.innerHTML = '';

            if (sortedRanking.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted py-4">Belum ada data pelanggaran tercatat.</td></tr>`;
                return;
            }

            // Tampilkan peringkat (misal diambil 15 peringkat teratas agar pas di layar TV)
            sortedRanking.slice(0, 15).forEach((item, index) => {
                let badgeRank = `<span class="text-muted fw-bold">${index + 1}</span>`;
                if (index === 0) badgeRank = `<span class="badge bg-warning text-dark fs-6 px-2">1</span>`;
                else if (index === 1) badgeRank = `<span class="badge bg-secondary fs-6 px-2">2</span>`;
                else if (index === 2) badgeRank = `<span class="badge bg-danger fs-6 px-2">3</span>`;

                tbody.innerHTML += `
                    <tr>
                        <td class="text-center">${badgeRank}</td>
                        <td class="fw-semibold fs-5">${item.nama}</td>
                        <td class="text-center"><span class="badge bg-danger fs-5 px-3">-${item.total} Poin</span></td>
                    </tr>
                `;
            });
        }

        // Jalankan saat halaman dimuat
        renderMonitor();

        // Fitur Real-Time: Otomatis update saat ada input baru dari index.html
        window.addEventListener('storage', function(e) {
            if (e.key === 'pobako_data') {
                renderMonitor();
            }
        });
    </script>
</body>
</html>
